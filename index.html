<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Alina's Bar - TPV Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #f0f0f0;
        }

        /* ============================================
           LOGIN
           ============================================ */

        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
        }

        .login-box {
            background: #2a2a2a;
            padding: 2.5rem;
            border-radius: 1rem;
            border: 2px solid #f97316;
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            font-size: 2rem;
            color: #f97316;
            margin-bottom: 0.5rem;
        }

        .login-box p {
            color: #9ca3af;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #444;
            border-radius: 0.5rem;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: #f97316;
            color: #1a1a1a;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .login-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .login-options button {
            padding: 0.75rem;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .demo-info {
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            line-height: 1.5;
        }

        .connection-status {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.75rem;
        }

        .connection-status.online { color: #10b981; }
        .connection-status.offline { color: #ef4444; }

        .hidden {
            display: none !important;
        }

        /* ============================================
           PANTALLA: INICIO (MESAS)
           ============================================ */

        .screen-home {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 1rem;
            background: #1a1a1a;
            overflow: hidden;
        }

        .home-header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f97316;
        }

        .home-header h1 {
            font-size: 1.8rem;
            color: #f97316;
        }

        .home-header p {
            color: #9ca3af;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .home-actions {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .home-actions .badge {
            background: #3b82f6;
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .home-actions .logout-btn {
            background: #6b7280;
            color: #fff;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .mesas-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 0.75rem;
            overflow-y: auto;
        }

        .mesa-item {
            aspect-ratio: 1;
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0.5rem;
            text-align: center;
            position: relative;
        }

        .mesa-item:hover {
            border-color: #f97316;
            transform: scale(1.05);
        }

        .mesa-item.ocupada {
            background: #3a2a1a;
            border-color: #f59e0b;
        }

        .mesa-num {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .mesa-total {
            font-size: 0.65rem;
            color: #f97316;
            font-weight: 700;
            margin-top: 0.25rem;
        }

        /* ============================================
           PANTALLA: COMANDA
           ============================================ */

        .screen-comanda {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1a1a1a;
            overflow: hidden;
        }

        .comanda-header {
            background: #0d0d0d;
            padding: 0.75rem;
            border-bottom: 2px solid #f97316;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .comanda-header-left {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .back-btn {
            background: #6b7280;
            color: #fff;
            border: none;
            padding: 0.5rem 0.8rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .header-mesa-info {
            display: flex;
            gap: 1rem;
        }

        .header-item {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .header-label {
            font-size: 0.65rem;
            color: #9ca3af;
            text-transform: uppercase;
        }

        .header-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f97316;
        }

        /* CATEGORÍAS FIJAS (siempre visibles, no se cierran) */

        .categories-fixed {
            background: #0d0d0d;
            padding: 0.5rem;
            border-bottom: 1px solid #333;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .cat-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 0.4rem;
            padding: 0.5rem 0.3rem;
            cursor: pointer;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
        }

        .cat-btn.active {
            background: #f97316;
            color: #000;
            border-color: #f97316;
        }

        .cat-icon {
            font-size: 1.1rem;
            display: block;
        }

        /* PRODUCTOS: área fija debajo de categorías, cambia el contenido al clicar */

        .products-fixed {
            background: #1a1a1a;
            padding: 0.5rem;
            border-bottom: 2px solid #333;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.4rem;
            max-height: 30%;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .product-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 0.4rem;
            padding: 0.4rem;
            cursor: pointer;
            text-align: center;
            font-size: 0.75rem;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .product-btn:active {
            border-color: #f97316;
            background: #3a2a1a;
        }

        .product-btn-icon {
            font-size: 1.3rem;
        }

        .product-btn-name {
            font-weight: 600;
            line-height: 1.1;
        }

        .product-btn-price {
            color: #f97316;
            font-weight: 700;
            font-size: 0.7rem;
        }

        /* LISTA DE PEDIDO: una sola lista combinada (pedido + histórico) */

        .order-list-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0d0d0d;
        }

        .order-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .order-empty {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            padding: 1.5rem;
        }

        .order-row {
            background: #2a2a2a;
            border-left: 3px solid #10b981;
            padding: 0.4rem 0.5rem;
            border-radius: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
        }

        .order-row.pending {
            border-left-color: #f59e0b;
            background: #3a2a1a;
        }

        .order-row-name {
            flex: 1;
            font-weight: 600;
        }

        .order-row-qty {
            background: #444;
            padding: 0.15rem 0.4rem;
            border-radius: 0.2rem;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .order-row-price {
            color: #f97316;
            font-weight: 700;
            min-width: 2.2rem;
            text-align: right;
        }

        .order-row-del {
            background: #ef4444;
            color: #fff;
            border: none;
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* ACCIONES: compactas, en una sola fila */

        .comanda-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1.4fr;
            gap: 0.3rem;
            padding: 0.4rem;
            background: #0d0d0d;
            border-top: 1px solid #333;
        }

        .action-btn {
            padding: 0.5rem 0.3rem;
            border: none;
            border-radius: 0.3rem;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .btn-send {
            background: #10b981;
            color: #fff;
        }

        .btn-print {
            background: #3b82f6;
            color: #fff;
        }

        .btn-close-account {
            background: #dc2626;
            color: #fff;
        }

        .btn-trash-header {
            background: #444;
            color: #fff;
            border: none;
            padding: 0.4rem 0.6rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-clear {
            background: #6b7280;
            color: #fff;
        }

        /* ============================================
           PANTALLA: COCINA
           ============================================ */

        .screen-kitchen {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1a1a1a;
            padding: 1rem;
            overflow: hidden;
        }

        .kitchen-header {
            text-align: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #10b981;
            position: relative;
        }

        .kitchen-header h1 {
            font-size: 1.8rem;
            color: #10b981;
        }

        .kitchen-orders {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            overflow-y: auto;
            align-content: start;
        }

        .kitchen-card {
            background: #2a2a2a;
            border: 2px solid #f59e0b;
            border-radius: 0.5rem;
            padding: 1rem;
        }

        .kitchen-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #444;
        }

        .kitchen-card-mesa {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f97316;
        }

        .kitchen-card-time {
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .kitchen-card-items {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .kitchen-card-item {
            background: #1a1a1a;
            padding: 0.5rem;
            border-radius: 0.3rem;
            border-left: 3px solid #f97316;
        }

        .kitchen-item-qty {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .kitchen-item-name {
            color: #fff;
            font-size: 0.9rem;
        }

        .kitchen-card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .kitchen-btn {
            padding: 0.6rem;
            border: none;
            border-radius: 0.4rem;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-done {
            background: #10b981;
            color: #fff;
        }

        .btn-cancel {
            background: #6b7280;
            color: #fff;
        }

        /* ============================================
           TOAST
           ============================================ */

        .toast {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            background: #10b981;
            color: #fff;
            padding: 0.75rem 1.2rem;
            border-radius: 0.5rem;
            z-index: 1000;
            animation: slideUp 0.3s ease-out;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .toast.error {
            background: #ef4444;
        }

        @keyframes slideUp {
            from {
                transform: translateY(200px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */

        @media (max-width: 768px) {
            .mesas-grid {
                grid-template-columns: repeat(5, 1fr);
            }

            .comanda-header {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .header-mesa-info {
                gap: 0.5rem;
            }

            .product-btn {
                font-size: 0.7rem;
            }

            .product-btn-icon {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>🍷 Alina's Bar</h1>
            <p>Sistema Profesional de Comandas</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" value="camarero@alinas.bar" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" value="demo123" required>
                </div>

                <button type="submit" class="login-btn">ACCEDER</button>

                <div class="login-options">
                    <button type="button" onclick="quickLogin('camarero@alinas.bar', 'demo123')">📦 Camarero</button>
                    <button type="button" onclick="quickLogin('cocina@alinas.bar', 'demo123')">👨‍🍳 Cocina</button>
                </div>
            </form>

            <div class="demo-info">
                <strong>👤 Usuarios:</strong><br>
                📦 camarero@alinas.bar<br>
                👨‍🍳 cocina@alinas.bar<br>
                Contraseña: demo123
            </div>

            <div class="connection-status" id="connectionStatus">
                ⏳ Conectando con la base de datos...
            </div>
        </div>
    </div>

    <!-- PANTALLA: INICIO (MESAS) -->
    <div id="screenHome" class="screen-home hidden">
        <div class="home-actions">
            <span class="sync-dot"></span>
            <span class="badge" id="userBadge">CAMARERO</span>
            <button class="logout-btn" onclick="logout()">SALIR</button>
        </div>

        <div class="home-header">
            <h1>🍷 ALINA'S BAR</h1>
            <p>Selecciona una mesa para comenzar</p>
        </div>

        <div class="mesas-grid" id="mesasGrid"></div>
    </div>

    <!-- PANTALLA: COMANDA -->
    <div id="screenComanda" class="screen-comanda hidden">
        <div class="comanda-header">
            <div class="comanda-header-left">
                <button class="back-btn" onclick="goHome()">← ATRÁS</button>
                <div class="header-mesa-info">
                    <div class="header-item">
                        <span class="header-label">Mesa</span>
                        <span class="header-value" id="headerMesa">-</span>
                    </div>
                    <div class="header-item">
                        <span class="header-label">Total</span>
                        <span class="header-value" id="headerTotal">0,00€</span>
                    </div>
                </div>
            </div>
            <button class="btn-trash-header" onclick="clearPendingCart()" title="Borrar lo que aún no se ha enviado">🗑️</button>
        </div>

        <div class="categories-fixed" id="categoriesFixed"></div>

        <div class="products-fixed" id="productsFixed"></div>

        <div class="order-list-wrap">
            <div class="order-list" id="orderList"></div>
        </div>

        <div class="comanda-actions">
            <button class="action-btn btn-print" onclick="printOrder()">🖨️</button>
            <button class="action-btn btn-close-account" onclick="closeAccount()">💰 COBRAR</button>
            <button class="action-btn btn-send" onclick="sendOrder()">📤 ENVIAR COCINA</button>
        </div>
    </div>

    <!-- PANTALLA: COCINA -->
    <div id="screenKitchen" class="screen-kitchen hidden">
        <div class="kitchen-header">
            <span class="sync-dot" style="position:absolute; top:0; right:0;"></span>
            <h1>👨‍🍳 COCINA</h1>
            <p id="kitchenTime">Esperando órdenes...</p>
        </div>
        <div class="kitchen-orders" id="kitchenOrders"></div>
    </div>

    <script>
        // ============================================
        // SUPABASE CONFIG (con protección de errores)
        // ============================================

        const SUPABASE_URL = 'https://fasrtzqwbacchxrffxxm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_HQOOb239BGQKhxSBgbX01w_zXyp0VA9';

        let supabaseClient = null;

        function initSupabase() {
            try {
                if (typeof window.supabase === 'undefined') {
                    throw new Error('La librería de Supabase no se cargó (revisa tu conexión a internet)');
                }
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                return true;
            } catch (e) {
                console.error('Error inicializando Supabase:', e);
                const status = document.getElementById('connectionStatus');
                if (status) {
                    status.textContent = '❌ ' + e.message + ' — recarga la página';
                    status.className = 'connection-status offline';
                }
                return false;
            }
        }

        // ============================================
        // ESTADO GLOBAL
        // ============================================

        const STATE = {
            user: null,
            currentTable: null,
            currentOrder: [],
            categories: [
                { id: '1', name: 'Cervezas', icon: '🍺' },
                { id: '2', name: 'Bebidas', icon: '🥤' },
                { id: '3', name: 'Desayunos', icon: '🥐' },
                { id: '4', name: 'Cafés', icon: '☕' },
                { id: '5', name: 'Refrescos', icon: '🧃' },
                { id: '6', name: 'Tapas', icon: '🍤' },
            ],
            products: [
                { id: '1', name: 'Caña', price: 2.50, category_id: '1', icon: '🍺' },
                { id: '2', name: 'Botellín', price: 3.00, category_id: '1', icon: '🍾' },
                { id: '3', name: 'Tercio', price: 4.00, category_id: '1', icon: '🍻' },
                { id: '4', name: 'Agua', price: 1.50, category_id: '2', icon: '💧' },
                { id: '5', name: 'Coca', price: 2.00, category_id: '2', icon: '🥤' },
                { id: '6', name: 'Fanta', price: 2.00, category_id: '2', icon: '🧡' },
                { id: '7', name: 'Tostada', price: 2.50, category_id: '3', icon: '🍞' },
                { id: '8', name: 'Croissant', price: 2.00, category_id: '3', icon: '🥐' },
                { id: '9', name: 'Churro', price: 1.50, category_id: '3', icon: '🍮' },
                { id: '10', name: 'Café Solo', price: 1.50, category_id: '4', icon: '☕' },
                { id: '11', name: 'Café Leche', price: 2.00, category_id: '4', icon: '🥛' },
                { id: '12', name: 'Cortado', price: 1.75, category_id: '4', icon: '☕' },
                { id: '13', name: 'Zumo', price: 2.50, category_id: '5', icon: '🍊' },
                { id: '14', name: 'Refresco', price: 1.50, category_id: '5', icon: '🧃' },
                { id: '15', name: 'Aceitunas', price: 1.50, category_id: '6', icon: '🫒' },
                { id: '16', name: 'Jamón', price: 3.50, category_id: '6', icon: '🍖' },
            ],
            tables: [],
            orders: [],
            users: [
                { email: 'camarero@alinas.bar', password: 'demo123', role: 'camarero' },
                { email: 'cocina@alinas.bar', password: 'demo123', role: 'cocina' },
            ],
        };

        // ============================================
        // SUPABASE: CARGAR DATOS
        // ============================================

        // Orden fijo y correcto de las mesas (evita que Supabase las ordene mal alfabéticamente)
        const TABLE_ORDER = [
            't1','t2','t3','t4','t5','t6','t7','t8','t9','t10','t11','t12','t13',
            'b1','b2','b3','b4','b5','b6',
            's1','s2','s3','s4'
        ];

        async function loadTables() {
            const { data, error } = await supabaseClient.from('tables').select('*');
            if (error) {
                console.error('Error cargando mesas:', error);
                alert('❌ Error cargando mesas: ' + error.message);
                throw error;
            }
            // Reordenar según TABLE_ORDER para que siempre salgan T1, T2, T3... en orden
            STATE.tables = TABLE_ORDER
                .map(id => data.find(t => t.id === id))
                .filter(t => t !== undefined);
        }

        async function loadOrders() {
            const { data, error } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error('Error cargando órdenes:', error);
                return;
            }
            STATE.orders = data;
        }

        // ============================================
        // SUPABASE: REALTIME SUBSCRIPTIONS
        // ============================================

        function setupRealtimeSubscriptions() {
            supabaseClient
                .channel('tables-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'tables' }, (payload) => {
                    loadTables().then(() => {
                        if (!document.getElementById('screenHome').classList.contains('hidden')) {
                            renderMesas();
                        }
                    });
                })
                .subscribe();

            supabaseClient
                .channel('orders-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, (payload) => {
                    loadOrders().then(() => {
                        if (!document.getElementById('screenKitchen').classList.contains('hidden')) {
                            renderKitchenOrders();
                        }
                    });
                })
                .subscribe();
        }

        // ============================================
        // LOGIN
        // ============================================

        function login(e) {
            e.preventDefault();

            if (!supabaseClient) {
                const ok = initSupabase();
                if (!ok) {
                    showToast('❌ Sin conexión a la base de datos. Recarga la página.', 'error');
                    return;
                }
            }

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const user = STATE.users.find(u => u.email === email && u.password === password);

            if (user) {
                STATE.user = user;
                if (user.role === 'cocina') {
                    showKitchenScreen();
                } else {
                    showHomeScreen();
                }
            } else {
                showToast('❌ Credenciales incorrectas', 'error');
            }
        }

        function quickLogin(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }

        function logout() {
            STATE.user = null;
            STATE.currentTable = null;
            STATE.currentOrder = [];
            if (kitchenPollInterval) {
                clearInterval(kitchenPollInterval);
                kitchenPollInterval = null;
            }
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('screenHome').classList.add('hidden');
            document.getElementById('screenComanda').classList.add('hidden');
            document.getElementById('screenKitchen').classList.add('hidden');
        }

        // ============================================
        // PANTALLA: INICIO
        // ============================================

        async function showHomeScreen() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('screenHome').classList.remove('hidden');
            document.getElementById('screenComanda').classList.add('hidden');
            document.getElementById('screenKitchen').classList.add('hidden');

            document.getElementById('userBadge').textContent = STATE.user.role.toUpperCase();

            try {
                await loadTables();
                renderMesas();
            } catch (e) {
                console.error('Error mostrando mesas:', e);
                document.getElementById('mesasGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:2rem;color:#ef4444;">❌ Error al cargar las mesas. Revisa la conexión a Supabase.</div>';
            }
        }

        function renderMesas() {
            const html = STATE.tables.map((table, idx) => `
                <div class="mesa-item ${table.total > 0 ? 'ocupada' : ''}" onclick="selectMesa('${table.id}')">
                    <div class="mesa-num">${idx + 1}</div>
                    ${table.total > 0 ? `<div class="mesa-total">${parseFloat(table.total).toFixed(2)}€</div>` : ''}
                </div>
            `).join('');
            document.getElementById('mesasGrid').innerHTML = html;
        }

        async function selectMesa(tableId) {
            const table = STATE.tables.find(t => t.id === tableId);
            if (table) {
                STATE.currentTable = table;
                if (!STATE.currentTable.consumed) STATE.currentTable.consumed = [];
                STATE.selectedCategory = null;
                showComandaScreen();
            }
        }

        // ============================================
        // PANTALLA: COMANDA
        // ============================================

        function showComandaScreen() {
            document.getElementById('screenHome').classList.add('hidden');
            document.getElementById('screenComanda').classList.remove('hidden');

            document.getElementById('headerMesa').textContent = STATE.currentTable.name;

            renderCategoriesFixed();
            // Selecciona la primera categoría por defecto
            selectCategory(STATE.categories[0].id);
            renderOrderList();
        }

        // Categorías: SIEMPRE visibles, fijas arriba (no se cierran nunca)
        function renderCategoriesFixed() {
            const html = STATE.categories.map(cat => `
                <div class="cat-btn ${cat.id === STATE.selectedCategory ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
                    <span class="cat-icon">${cat.icon}</span>${cat.name}
                </div>
            `).join('');
            document.getElementById('categoriesFixed').innerHTML = html;
        }

        // Al clicar una categoría, solo cambia el contenido de productos debajo (el resto no se mueve)
        function selectCategory(catId) {
            STATE.selectedCategory = catId;
            renderCategoriesFixed();

            const products = STATE.products.filter(p => p.category_id === catId);
            const html = products.map(p => `
                <button class="product-btn" onclick="addProduct('${p.id}')">
                    <div class="product-btn-icon">${p.icon}</div>
                    <div class="product-btn-name">${p.name}</div>
                    <div class="product-btn-price">${p.price.toFixed(2)}€</div>
                </button>
            `).join('');
            document.getElementById('productsFixed').innerHTML = html;
        }

        // Añade un producto: se guarda directamente como "pendiente" (sent:false) en la lista única de la mesa
        async function addProduct(productId) {
            const product = STATE.products.find(p => p.id === productId);
            const consumed = STATE.currentTable.consumed || [];

            const existing = consumed.find(item => item.product_id === productId && !item.sent);
            if (existing) {
                existing.quantity += 1;
            } else {
                consumed.push({
                    product_id: productId,
                    name: product.name,
                    price: product.price,
                    quantity: 1,
                    icon: product.icon,
                    sent: false,
                });
            }

            STATE.currentTable.consumed = consumed;
            recalcTableTotal();
            renderOrderList();
            await persistTable();
            showToast(`✓ ${product.name}`);
        }

        // Recalcula el total de la mesa (con IVA 21%) a partir de la lista completa
        function recalcTableTotal() {
            const consumed = STATE.currentTable.consumed || [];
            const subtotal = consumed.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            STATE.currentTable.total = subtotal * 1.21;
        }

        // Guarda mesa (total + lista) en Supabase
        async function persistTable() {
            await supabaseClient
                .from('tables')
                .update({
                    total: STATE.currentTable.total,
                    consumed: STATE.currentTable.consumed,
                    updated_at: new Date().toISOString(),
                })
                .eq('id', STATE.currentTable.id);
        }

        // Lista ÚNICA combinada: pedidos ya enviados (verde) + pendientes de enviar (naranja)
        function renderOrderList() {
            const consumed = STATE.currentTable.consumed || [];

            if (consumed.length === 0) {
                document.getElementById('orderList').innerHTML = '<div class="order-empty">Sin productos todavía. Selecciona una categoría arriba.</div>';
            } else {
                const html = consumed.map((item, idx) => `
                    <div class="order-row ${item.sent ? '' : 'pending'}">
                        <span class="order-row-name">${item.icon} ${item.name} ${item.sent ? '' : '(sin enviar)'}</span>
                        <span class="order-row-qty">${item.quantity}</span>
                        <span class="order-row-price">${(item.price * item.quantity).toFixed(2)}€</span>
                        <button class="order-row-del" onclick="removeItem(${idx})">✕</button>
                    </div>
                `).join('');
                document.getElementById('orderList').innerHTML = html;
            }

            document.getElementById('headerTotal').textContent = (parseFloat(STATE.currentTable.total) || 0).toFixed(2) + '€';
        }

        async function removeItem(idx) {
            STATE.currentTable.consumed.splice(idx, 1);
            recalcTableTotal();
            renderOrderList();
            await persistTable();
        }

        // Borra solo lo que aún no se ha enviado a cocina (botón papelera de arriba)
        async function clearPendingCart() {
            const consumed = STATE.currentTable.consumed || [];
            const hasPending = consumed.some(item => !item.sent);
            if (!hasPending) {
                showToast('❌ No hay nada pendiente de enviar', 'error');
                return;
            }
            if (!confirm('¿Borrar lo que aún no se ha enviado a cocina?')) return;

            STATE.currentTable.consumed = consumed.filter(item => item.sent);
            recalcTableTotal();
            renderOrderList();
            await persistTable();
        }

        async function sendOrder() {
            const pending = (STATE.currentTable.consumed || []).filter(item => !item.sent);

            if (pending.length === 0) {
                showToast('❌ No hay productos nuevos que enviar', 'error');
                return;
            }

            const subtotal = pending.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const vat = subtotal * 0.21;
            const total = subtotal + vat;

            const { error: orderError } = await supabaseClient.from('orders').insert({
                table_id: STATE.currentTable.id,
                table_name: STATE.currentTable.name,
                items: pending,
                subtotal: subtotal,
                vat: vat,
                total: total,
                status: 'pendiente',
            });

            if (orderError) {
                showToast('❌ Error al enviar', 'error');
                console.error(orderError);
                return;
            }

            // Marcar como enviados todos los pendientes
            STATE.currentTable.consumed.forEach(item => { item.sent = true; });
            await persistTable();

            showToast('✓ Comanda enviada a cocina');
            renderOrderList();
        }

        // ============================================
        // COBRAR Y CERRAR MESA (contabilidad)
        // ============================================

        async function closeAccount() {
            const table = STATE.currentTable;
            const totalMesa = parseFloat(table.total) || 0;
            const consumed = table.consumed || [];

            if (consumed.length === 0) {
                showToast('❌ Esta mesa no tiene consumo', 'error');
                return;
            }

            const hasPending = consumed.some(item => !item.sent);
            if (hasPending) {
                showToast('❌ Envía o borra lo pendiente antes de cobrar', 'error');
                return;
            }

            if (!confirm(`¿Cobrar mesa ${table.name} por ${totalMesa.toFixed(2)}€ y cerrarla?`)) return;

            await supabaseClient.from('sales_history').insert({
                table_id: table.id,
                table_name: table.name,
                items: consumed,
                total: totalMesa,
            });

            await supabaseClient
                .from('tables')
                .update({ total: 0, consumed: [], current_order: [], updated_at: new Date().toISOString() })
                .eq('id', table.id);

            showToast('✓ Mesa cobrada y cerrada');
            setTimeout(() => goHome(), 1000);
        }

        function printOrder() {
            const consumed = STATE.currentTable.consumed || [];
            if (consumed.length === 0) {
                showToast('❌ Sin productos', 'error');
                return;
            }

            const total = parseFloat(STATE.currentTable.total) || 0;

            let html = `<html><head><style>body{font-family:monospace;width:80mm;padding:1rem;margin:0}h1{text-align:center;font-size:1rem}table{width:100%;font-size:0.8rem}td{padding:0.25rem}tr.total td{font-weight:bold}.line{border-top:1px dashed #000;margin:0.5rem 0}</style></head><body>`;
            html += `<h1>ALINA'S BAR</h1>`;
            html += `<p style="text-align:center;font-size:0.8rem">Mesa: ${STATE.currentTable.name}</p>`;
            html += `<p style="text-align:center;font-size:0.7rem">${new Date().toLocaleString('es-ES')}</p>`;
            html += `<div class="line"></div><table>`;

            consumed.forEach(item => {
                html += `<tr><td>${item.quantity}x ${item.name}</td><td style="text-align:right">${(item.price * item.quantity).toFixed(2)}€</td></tr>`;
            });

            html += `</table><div class="line"></div><table style="margin-top:0.5rem"><tr class="total"><td>TOTAL:</td><td style="text-align:right">${total.toFixed(2)}€</td></tr></table><p style="text-align:center;margin-top:1rem;font-size:0.8rem">¡Gracias!</p></body></html>`;

            const win = window.open();
            win.document.write(html);
            win.print();
        }

        function goHome() {
            showHomeScreen();
        }

        // ============================================
        // PANTALLA: COCINA
        // ============================================

        let kitchenPollInterval = null;

        async function showKitchenScreen() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('screenHome').classList.add('hidden');
            document.getElementById('screenComanda').classList.add('hidden');
            document.getElementById('screenKitchen').classList.remove('hidden');

            await loadOrders();
            renderKitchenOrders();

            // Respaldo: refresca cada 3 segundos por si el tiempo real falla en la red móvil
            if (kitchenPollInterval) clearInterval(kitchenPollInterval);
            kitchenPollInterval = setInterval(async () => {
                await loadOrders();
                renderKitchenOrders();
            }, 3000);
        }

        function renderKitchenOrders() {
            const pendingOrders = STATE.orders.filter(o => o.status === 'pendiente');
            document.getElementById('kitchenTime').textContent = pendingOrders.length + ' orden(es) pendiente(s)';

            if (pendingOrders.length === 0) {
                document.getElementById('kitchenOrders').innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: #9ca3af;">✓ Todas las órdenes completadas</div>';
                return;
            }

            const html = pendingOrders.map(order => `
                <div class="kitchen-card">
                    <div class="kitchen-card-header">
                        <div class="kitchen-card-mesa">🏠 ${order.table_name}</div>
                        <div class="kitchen-card-time">${new Date(order.created_at).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'})}</div>
                    </div>
                    <div class="kitchen-card-items">
                        ${order.items.map(item => `
                            <div class="kitchen-card-item">
                                <div class="kitchen-item-qty">${item.quantity}x ${item.icon}</div>
                                <div class="kitchen-item-name">${item.name}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="kitchen-card-actions">
                        <button class="kitchen-btn btn-done" onclick="completeOrder(${order.id})">✓ LISTO</button>
                        <button class="kitchen-btn btn-cancel" onclick="cancelOrder(${order.id})">✕ CANCEL</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('kitchenOrders').innerHTML = html;
        }

        async function completeOrder(orderId) {
            await supabaseClient.from('orders').update({ status: 'completada' }).eq('id', orderId);
            showToast('✓ Orden completada');
        }

        async function cancelOrder(orderId) {
            if (confirm('¿Cancelar orden?')) {
                await supabaseClient.from('orders').delete().eq('id', orderId);
                showToast('✓ Orden cancelada');
            }
        }

        // ============================================
        // UTILIDADES
        // ============================================

        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // ============================================
        // INICIO
        // ============================================

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('loginForm').addEventListener('submit', login);

            try {
                await loadTables();
                document.getElementById('connectionStatus').textContent = '✓ Conectado a la base de datos';
                document.getElementById('connectionStatus').className = 'connection-status online';
            } catch (e) {
                document.getElementById('connectionStatus').textContent = '❌ Error de conexión';
                document.getElementById('connectionStatus').className = 'connection-status offline';
            }

            setupRealtimeSubscriptions();

            const url = new URLSearchParams(window.location.search);
            if (url.get('kitchen') === 'true') {
                STATE.user = { role: 'cocina' };
                showKitchenScreen();
            }
        });
    </script>
</body>
</html>
