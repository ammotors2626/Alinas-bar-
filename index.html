<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Alina's Bar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a1a;color:#f0f0f0}
.hidden{display:none!important}

/* LOGIN */
.login-screen{display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;background:linear-gradient(135deg,#1a1a1a,#0d0d0d);padding:1rem}
.login-box{background:#2a2a2a;padding:2rem;border-radius:1rem;border:2px solid #f97316;width:100%;max-width:380px}
.login-box h1{font-size:1.8rem;color:#f97316;margin-bottom:.3rem}
.login-box p{color:#9ca3af;margin-bottom:1.2rem;font-size:.85rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;margin-bottom:.35rem;font-weight:600;font-size:.85rem}
.form-group input{width:100%;padding:.7rem;border:1px solid #444;border-radius:.5rem;background:#1a1a1a;color:#fff;font-size:1rem}
.login-btn{width:100%;padding:.9rem;background:#f97316;color:#1a1a1a;border:none;border-radius:.5rem;font-size:1rem;font-weight:700;margin-bottom:.8rem}
.role-grid{display:flex;flex-direction:column;gap:.7rem;margin-top:1rem}
.role-btn{padding:1.1rem .8rem;border:2px solid #444;background:#2a2a2a;color:#fff;border-radius:.6rem;font-weight:800;font-size:1rem;display:flex;align-items:center;gap:.8rem;text-align:left}
.role-btn .ico{font-size:1.6rem}
.role-btn .txt{flex:1}
.role-btn .sub{display:block;font-size:.65rem;font-weight:600;color:#9ca3af;margin-top:.15rem}
.role-gerente{border-color:#8b5cf6}
.role-camarero{border-color:#3b82f6}
.role-cocina{border-color:#10b981}
.pin-box{margin-top:1rem}
.pin-box input{width:100%;padding:.8rem;background:#1a1a1a;border:2px solid #8b5cf6;border-radius:.5rem;color:#fff;font-size:1.4rem;text-align:center;letter-spacing:.5rem;font-weight:800}
.login-options{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.login-options button{padding:.7rem;border:1px solid #444;background:#2a2a2a;color:#fff;border-radius:.5rem;font-weight:600;font-size:.8rem}
.connection-status{text-align:center;margin-top:.8rem;font-size:.7rem;color:#9ca3af}
.connection-status.online{color:#10b981}
.connection-status.offline{color:#ef4444}

/* HOME MESAS - todo en pantalla sin scroll */
.screen-home{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:.5rem;overflow:hidden}
.home-top{display:flex;justify-content:space-between;align-items:center;padding:.3rem .2rem .5rem;border-bottom:2px solid #f97316;margin-bottom:.5rem;flex-shrink:0}
.home-top h1{font-size:1rem;color:#f97316;font-weight:800}
.home-top-right{display:flex;gap:.3rem;align-items:center}
.icon-btn{background:#6b7280;color:#fff;border:none;padding:.3rem .5rem;border-radius:.35rem;font-size:.75rem}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;margin-bottom:.5rem;flex-shrink:0}
.zone-btn{background:#2a2a2a;border:1.5px solid #444;color:#9ca3af;padding:.45rem .2rem;border-radius:.35rem;font-size:.7rem;font-weight:800}
.zone-btn.active{background:#f97316;color:#000;border-color:#f97316}
/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:flex;align-items:center;justify-content:center;padding:.6rem}
.modal-box{background:#1a1a1a;border:2px solid #f97316;border-radius:.6rem;width:100%;max-width:420px;max-height:92vh;display:flex;flex-direction:column}
.modal-head{padding:.6rem;border-bottom:1px solid #333;font-weight:800;color:#f97316;font-size:.9rem;flex-shrink:0}
.modal-body{padding:.5rem;overflow-y:auto;flex:1}
.mod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.3rem}
.mod-opt{background:#2a2a2a;border:1.5px solid #444;border-radius:.3rem;padding:.45rem .3rem;font-size:.65rem;font-weight:700;color:#fff;text-align:center;line-height:1.15}
.mod-opt.on{background:#10b981;border-color:#10b981;color:#fff}
.modal-foot{padding:.5rem;border-top:1px solid #333;display:grid;grid-template-columns:1fr 1.5fr;gap:.4rem;flex-shrink:0}
.mf-btn{padding:.6rem;border:none;border-radius:.35rem;font-weight:800;font-size:.75rem}
.mf-cancel{background:#6b7280;color:#fff}
.mf-ok{background:#10b981;color:#fff}
/* INFORME */
.rep-wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding:.6rem}
.rep-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:.5rem;border-bottom:2px solid #f97316;margin-bottom:.5rem;flex-shrink:0}
.rep-head h1{font-size:1rem;color:#f97316}
.rep-body{flex:1;overflow-y:auto}
.rep-tot{background:#10b981;color:#fff;padding:.7rem;border-radius:.4rem;text-align:center;margin-bottom:.6rem}
.rep-tot .big{font-size:1.6rem;font-weight:800}
.rep-tot .sm{font-size:.7rem;opacity:.9}
.rep-row{background:#2a2a2a;padding:.4rem .5rem;border-radius:.3rem;display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:.2rem}
.rep-row .q{color:#f97316;font-weight:800;min-width:2rem}
.rep-sec{font-size:.75rem;font-weight:800;color:#f97316;margin:.6rem 0 .3rem}
/* qty +/- en lista */
.or-pm{background:#3b82f6;color:#fff;border:none;width:1.4rem;height:1.4rem;border-radius:.25rem;font-size:.8rem;font-weight:800;flex-shrink:0}
.badge{background:#3b82f6;color:#fff;padding:.3rem .6rem;border-radius:.35rem;font-size:.65rem;font-weight:700}
.logout-btn{background:#6b7280;color:#fff;border:none;padding:.3rem .6rem;border-radius:.35rem;font-weight:700;font-size:.65rem}
.mesas-grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:.35rem;overflow:hidden}
.mesa-item{background:#2a2a2a;border:1.5px solid #444;border-radius:.4rem;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:.15rem;min-height:0}
.mesa-item.ocupada{background:#3a2a1a;border-color:#f59e0b}
.mesa-num{font-size:.95rem;font-weight:800;color:#fff;line-height:1}
.mesa-total{font-size:.55rem;color:#f97316;font-weight:700;margin-top:.15rem;line-height:1}

/* COMANDA - layout fijo sin scroll global */
.screen-comanda{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.cmd-header{background:#0d0d0d;padding:.4rem .5rem;border-bottom:2px solid #f97316;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.cmd-header-left{display:flex;gap:.6rem;align-items:center}
.back-btn{background:#6b7280;color:#fff;border:none;padding:.4rem .6rem;border-radius:.35rem;font-weight:700;font-size:.7rem}
.hdr-mesa{font-size:.95rem;font-weight:800;color:#f97316}
.hdr-total{font-size:1.05rem;font-weight:800;color:#10b981}
.btn-trash{background:#ef4444;color:#fff;border:none;padding:.4rem .55rem;border-radius:.35rem;font-size:.8rem}

/* Categorías fijas: rejilla compacta 4 columnas */
.cats{background:#0d0d0d;padding:.3rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.25rem;flex-shrink:0;border-bottom:1px solid #333}
.cat-btn{background:#3b4a5f;border:1px solid #4a5a70;border-radius:.3rem;padding:.35rem .1rem;text-align:center;font-size:.55rem;font-weight:700;color:#fff;line-height:1.1;display:flex;align-items:center;justify-content:center;min-height:2.1rem}
.cat-btn.active{background:#f97316;color:#000;border-color:#fff}

/* Productos: rejilla que ocupa espacio fijo con scroll interno solo si hace falta */
.prods{background:#1a1a1a;padding:.3rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.25rem;overflow-y:auto;flex:1.1;align-content:start;border-bottom:2px solid #f97316}
.prod-btn{background:#2a2a2a;border:1px solid #444;border-radius:.3rem;padding:.3rem .15rem;text-align:center;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:.1rem;min-height:2.6rem}
.prod-btn:active{background:#f97316;color:#000}
.prod-name{font-size:.55rem;font-weight:700;line-height:1.05}
.prod-price{font-size:.55rem;color:#f97316;font-weight:800}
.prod-btn:active .prod-price{color:#000}

/* Lista pedido */
.order-list{flex:1;overflow-y:auto;padding:.3rem;display:flex;flex-direction:column;gap:.2rem;background:#0d0d0d}
.order-empty{text-align:center;color:#666;font-size:.7rem;padding:.8rem}
.order-row{background:#2a2a2a;border-left:3px solid #10b981;padding:.3rem .4rem;border-radius:.25rem;display:flex;align-items:center;gap:.35rem;font-size:.7rem}
.order-row.pending{border-left-color:#f59e0b;background:#3a2a1a}
.or-name{flex:1;font-weight:600;line-height:1.1}
.or-qty{background:#444;padding:.1rem .3rem;border-radius:.2rem;font-weight:800;font-size:.65rem}
.or-price{color:#f97316;font-weight:800;min-width:2.2rem;text-align:right}
.or-del{background:#ef4444;color:#fff;border:none;width:1.3rem;height:1.3rem;border-radius:50%;font-size:.6rem;font-weight:800;flex-shrink:0}

/* Acciones */
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:.25rem;padding:.3rem;background:#0d0d0d;border-top:1px solid #333;flex-shrink:0}
.act{padding:.55rem .2rem;border:none;border-radius:.3rem;font-weight:800;font-size:.65rem}
.a-print{background:#3b82f6;color:#fff}
.a-cobrar{background:#dc2626;color:#fff}
.a-send{background:#10b981;color:#fff}
.a-nota{background:#8b5cf6;color:#fff}
.a-extra{background:#f97316;color:#000}
.ed-wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding:.5rem}
.ed-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:.4rem;border-bottom:2px solid #10b981;margin-bottom:.4rem;flex-shrink:0}
.ed-head h1{font-size:.9rem;color:#10b981}
.ed-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:.2rem;margin-bottom:.4rem;flex-shrink:0}
.ed-cat{background:#2a2a2a;border:1px solid #444;color:#9ca3af;padding:.3rem .1rem;border-radius:.25rem;font-size:.5rem;font-weight:800;line-height:1.1}
.ed-cat.active{background:#10b981;color:#fff;border-color:#10b981}
.ed-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.25rem}
.ed-row{background:#2a2a2a;border-radius:.3rem;padding:.35rem .4rem;display:flex;align-items:center;gap:.3rem}
.ed-name{flex:1;background:#1a1a1a;border:1px solid #444;color:#fff;padding:.3rem;border-radius:.25rem;font-size:.7rem;min-width:0}
.ed-price{width:3.6rem;background:#1a1a1a;border:1px solid #444;color:#f97316;padding:.3rem;border-radius:.25rem;font-size:.7rem;font-weight:800;text-align:right}
.ed-cost{width:3.6rem;background:#1a1a1a;border:1px solid #444;color:#9ca3af;padding:.3rem;border-radius:.25rem;font-size:.7rem;text-align:right}
.ed-del{background:#ef4444;color:#fff;border:none;width:1.5rem;height:1.5rem;border-radius:.25rem;font-size:.65rem;font-weight:800;flex-shrink:0}
.ed-lbls{display:flex;gap:.3rem;font-size:.55rem;color:#9ca3af;padding:0 .4rem .2rem;flex-shrink:0}
.ed-foot{display:grid;grid-template-columns:1fr 1.3fr;gap:.4rem;padding-top:.4rem;flex-shrink:0}
.ed-btn{padding:.6rem;border:none;border-radius:.35rem;font-weight:800;font-size:.75rem}
.ed-add{background:#3b82f6;color:#fff}
.ed-save{background:#10b981;color:#fff}
.rep-periods{display:grid;grid-template-columns:repeat(4,1fr);gap:.25rem;padding:.3rem 0;flex-shrink:0}
.rep-per{background:#2a2a2a;border:1.5px solid #444;color:#9ca3af;padding:.4rem .1rem;border-radius:.3rem;font-size:.65rem;font-weight:800}
.rep-per.active{background:#f97316;color:#000;border-color:#f97316}
.rep-nav{display:flex;justify-content:space-between;align-items:center;padding:.3rem 0;flex-shrink:0}
.rep-nav button{background:#2a2a2a;border:1.5px solid #444;color:#fff;padding:.35rem .7rem;border-radius:.3rem;font-weight:800;font-size:.8rem}
.rep-nav span{font-size:.75rem;font-weight:800;color:#f97316}
.or-tap{cursor:pointer}
.a-ticket{background:#f59e0b;color:#000}
.tk-wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:#1a1a1a}
.tk-head{display:flex;justify-content:space-between;align-items:center;padding:.5rem;border-bottom:2px solid #f59e0b;flex-shrink:0}
.tk-head h1{font-size:.95rem;color:#f59e0b}
.tk-body{flex:1;overflow-y:auto;padding:.8rem;display:flex;justify-content:center}
.tk-paper{background:#fff;color:#000;width:100%;max-width:340px;padding:1rem;font-family:monospace;font-size:12px;border-radius:.3rem}
.tk-paper h2{font-size:16px;text-align:center;margin:0}
.tk-c{text-align:center}
.tk-sm{font-size:10px}
.tk-l{border-top:1px dashed #000;margin:6px 0}
.tk-paper table{width:100%;border-collapse:collapse}
.tk-paper td{padding:2px 0;vertical-align:top}
.tk-r{text-align:right}
.tk-tot{font-size:15px;font-weight:bold}
.tk-foot{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;padding:.5rem;background:#0d0d0d;border-top:1px solid #333;flex-shrink:0}
.tk-btn{padding:.7rem;border:none;border-radius:.35rem;font-weight:800;font-size:.8rem}
.tk-print{background:#3b82f6;color:#fff}
.tk-share{background:#10b981;color:#fff}
.nota-input{width:100%;padding:.6rem;background:#2a2a2a;border:1.5px solid #444;border-radius:.35rem;color:#fff;font-size:.85rem;font-family:inherit;resize:none}
.nota-input:focus{outline:none;border-color:#f97316}
.or-nota{border-left-color:#8b5cf6!important;background:#2d2440!important}
.k-nota{border-left-color:#8b5cf6!important;background:#2d2440}

/* COCINA */
.screen-kitchen{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:.6rem;overflow:hidden}
.k-head{text-align:center;padding-bottom:.5rem;border-bottom:2px solid #10b981;margin-bottom:.5rem;flex-shrink:0;position:relative}
.k-head h1{font-size:1.2rem;color:#10b981}
.k-head p{font-size:.7rem;color:#9ca3af}
.k-orders{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.6rem;overflow-y:auto;align-content:start}
.k-card{background:#2a2a2a;border:2px solid #f59e0b;border-radius:.5rem;padding:.7rem}
.k-card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;padding-bottom:.4rem;border-bottom:1px solid #444}
.k-mesa{font-size:1.1rem;font-weight:800;color:#f97316}
.k-time{font-size:.7rem;color:#9ca3af}
.k-items{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.6rem}
.k-item{background:#1a1a1a;padding:.35rem .5rem;border-radius:.25rem;border-left:3px solid #f97316;font-size:.8rem;font-weight:600}
.k-acts{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.k-btn{padding:.5rem;border:none;border-radius:.3rem;font-weight:800;font-size:.7rem}
.k-done{background:#10b981;color:#fff}
.k-cancel{background:#6b7280;color:#fff}


/* Zonas terraza/sala/barra */
.zone-btn{flex:1;background:#2a2a2a;border:1px solid #444;color:#9ca3af;padding:.35rem;border-radius:.35rem;font-size:.65rem;font-weight:700}
.zone-btn.active{background:#f97316;color:#000;border-color:#f97316}
.gear-btn{background:#4b5563;color:#fff;border:none;padding:.3rem .5rem;border-radius:.35rem;font-size:.75rem}

/* Modal modificadores */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:900;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#1a1a1a;border-top:3px solid #f97316;border-radius:1rem 1rem 0 0;width:100%;max-width:600px;max-height:88vh;display:flex;flex-direction:column}
.modal-head{padding:.7rem;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-title{font-size:.95rem;font-weight:800;color:#f97316}
.modal-price{font-size:.95rem;font-weight:800;color:#10b981}
.modal-body{flex:1;overflow-y:auto;padding:.5rem;display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;align-content:start}
.mod-chip{background:#2a2a2a;border:1.5px solid #444;border-radius:.35rem;padding:.45rem .2rem;text-align:center;font-size:.6rem;font-weight:700;color:#fff;line-height:1.1}
.mod-chip.on{background:#10b981;border-color:#10b981;color:#fff}
.mod-extra{font-size:.52rem;color:#f97316;display:block}
.mod-chip.on .mod-extra{color:#fff}
.modal-acts{display:grid;grid-template-columns:1fr 2fr;gap:.4rem;padding:.5rem;border-top:1px solid #333;flex-shrink:0}
.m-cancel{background:#6b7280;color:#fff;border:none;padding:.7rem;border-radius:.4rem;font-weight:800;font-size:.75rem}
.m-ok{background:#10b981;color:#fff;border:none;padding:.7rem;border-radius:.4rem;font-weight:800;font-size:.75rem}

/* Cantidad +/- en lista */
.qty-box{display:flex;align-items:center;gap:.2rem}
.qty-btn{background:#4b5563;color:#fff;border:none;width:1.25rem;height:1.25rem;border-radius:.2rem;font-size:.75rem;font-weight:800;line-height:1}
.or-mods{font-size:.55rem;color:#9ca3af;display:block;font-weight:500}

/* Informe del día */
.screen-report{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:.6rem;overflow:hidden}
.rep-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:.5rem;border-bottom:2px solid #f97316;margin-bottom:.5rem;flex-shrink:0}
.rep-head h1{font-size:1rem;color:#f97316}
.rep-totals{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:.5rem;flex-shrink:0}
.rep-card{background:#2a2a2a;border:1px solid #444;border-radius:.4rem;padding:.5rem;text-align:center}
.rep-card-lbl{font-size:.55rem;color:#9ca3af;text-transform:uppercase}
.rep-card-val{font-size:1rem;font-weight:800;color:#10b981}
.rep-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.2rem}
.rep-row{background:#2a2a2a;padding:.4rem .5rem;border-radius:.25rem;display:flex;align-items:center;gap:.4rem;font-size:.7rem;border-left:3px solid #f97316}
.rep-name{flex:1;font-weight:600}
.rep-qty{background:#444;padding:.1rem .35rem;border-radius:.2rem;font-weight:800;font-size:.65rem}
.rep-eur{color:#10b981;font-weight:800;min-width:3rem;text-align:right}

.toast{position:fixed;bottom:.7rem;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:.5rem 1rem;border-radius:.5rem;z-index:999;font-weight:700;font-size:.75rem}
.toast.error{background:#ef4444}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>🍷 Alina's Bar</h1>
    <p>¿Quién eres?</p>

    <div class="role-grid" id="roleGrid">
      <button class="role-btn role-camarero" onclick="pickRole('camarero')">
        <span class="ico">📦</span><span class="txt">CAMARERO<span class="sub">Tomar comandas y cobrar</span></span>
      </button>
      <button class="role-btn role-cocina" onclick="pickRole('cocina')">
        <span class="ico">👨‍🍳</span><span class="txt">COCINA<span class="sub">Ver los pedidos que llegan</span></span>
      </button>
      <button class="role-btn role-gerente" onclick="pickRole('gerente')">
        <span class="ico">🔑</span><span class="txt">GERENTE<span class="sub">Editar carta y ver cuentas</span></span>
      </button>
    </div>

    <div class="pin-box hidden" id="pinBox">
      <p style="font-size:.8rem;margin-bottom:.5rem">🔑 Introduce el PIN de gerente</p>
      <input type="tel" id="pinInput" maxlength="4" inputmode="numeric" placeholder="••••">
      <div class="login-options" style="margin-top:.8rem">
        <button type="button" onclick="cancelPin()">Cancelar</button>
        <button type="button" onclick="checkPin()" style="background:#8b5cf6;border-color:#8b5cf6">Entrar</button>
      </div>
    </div>

    <div class="connection-status" id="connStatus">⏳ Conectando...</div>
  </div>
</div>

<div id="screenHome" class="screen-home hidden">
  <div class="home-top">
    <h1>🍷 ALINA'S BAR</h1>
    <div class="home-top-right">
      <span class="badge" id="userBadge">CAMARERO</span>
      <button class="gear-btn gerente-only hidden" onclick="showReport()">⚙️</button>

 closeMod();

  toast('✓ Extras aplicados');
 }else{
  await pushItem(s.p,s.sel,s.p.p+extra);

}
async function pushItem(p,mods,price){
 const c=STATE.table.consumed||[];
 const key=p.id+'|'+mods.join(',');
 const ex=c.find(i=>i.key===key&&!i.sent);
 if(ex)ex.quantity+=1;
 else c.push({key:key,product_id:p.id,name:p.n,mods:mods,price:price,quantity:1,sent:false});
 STATE.table.consumed=c;
 recalc();renderOrder();await persist();
}
function recalc(){
 const c=STATE.table.consumed||[];
 STATE.table.total=c.reduce((s,i)=>s+i.price*i.quantity,0);
}

}

async function closeAccount(){
 const t=STATE.table,c=(t.consumed||[]).slice(),tot=parseFloat(t.total)||0;
 const cobrables=c.filter(i=>!i.isNota);
 if(!cobrables.length){toast('❌ Mesa sin consumo','error');return}
 if(c.some(i=>!i.sent&&!i.isNota)){toast('❌ Envía o borra lo pendiente','error');return}
 if(!confirm(`¿Cobrar ${t.name} por ${tot.toFixed(2)}€?\n\nLa mesa quedará libre.`))return;

 const fecha=new Date().toLocaleString('es-ES');
 const num='T'+Date.now().toString().slice(-8);

 // 1) Guardar la venta en el historial (contabilidad)
 const{error}=await sb.from('sales_history').insert({
  table_id:t.id,table_name:t.name,items:cobrables,total:tot
 });
 if(error){toast('❌ Error al guardar la venta','error');console.error(error);return}

 // 2) Vaciar la mesa (queda libre para seguir usándola al momento)
 await sb.from('tables').update({total:0,consumed:[],current_order:[],updated_at:new Date().toISOString()}).eq('id',t.id);
 t.total=0;t.consumed=[];

 // 3) Guardar el último ticket por si se quiere imprimir después
 STATE.lastTicket={mesa:t.name,items:cobrables,total:tot,fecha:fecha,num:num};

 toast('✓ Cobrado · Mesa libre');
 renderOrder();
}

// periodo: 'dia' | 'semana' | 'mes' | 'todo' ; offset: 0=actual, -1=anterior...
function repRange(){
 const p=STATE.repPeriod||'dia', o=STATE.repOffset||0;
 const now=new Date();
 let ini,fin,lbl;
 if(p==='dia'){
  ini=new Date(now);ini.setDate(ini.getDate()+o);ini.setHours(0,0,0,0);
  fin=new Date(ini);fin.setDate(fin.getDate()+1);
  lbl=o===0?'HOY · '+ini.toLocaleDateString('es-ES'):ini.toLocaleDateString('es-ES',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
 }else if(p==='semana'){
  ini=new Date(now);const d=(ini.getDay()+6)%7;
  ini.setDate(ini.getDate()-d+o*7);ini.setHours(0,0,0,0);
  fin=new Date(ini);fin.setDate(fin.getDate()+7);
  const f2=new Date(fin);f2.setDate(f2.getDate()-1);
  lbl=(o===0?'ESTA SEMANA · ':'')+ini.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})+' – '+f2.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'});
 }else if(p==='mes'){
  ini=new Date(now.getFullYear(),now.getMonth()+o,1);
  fin=new Date(now.getFullYear(),now.getMonth()+o+1,1);
  lbl=(o===0?'ESTE MES · ':'')+ini.toLocaleDateString('es-ES',{month:'long',year:'numeric'}).toUpperCase();
 }else{
  ini=new Date(2000,0,1);fin=new Date(2100,0,1);lbl='TODO EL HISTÓRICO';
 }
 return{ini,fin,lbl,p,o};
}
function setPeriod(p){STATE.repPeriod=p;STATE.repOffset=0;loadReport()}
function movePeriod(d){STATE.repOffset=(STATE.repOffset||0)+d;loadReport()}
async function loadReport(){
 if(!STATE.repPeriod)STATE.repPeriod='dia';
 const r=repRange();

 // Botones de periodo
 document.getElementById('repPeriods').innerHTML=
  [['dia','DÍA'],['semana','SEMANA'],['mes','MES'],['todo','TODO']].map(([k,n])=>
   `<button class="rep-per ${r.p===k?'active':''}" onclick="setPeriod('${k}')">${n}</button>`).join('');

 // Navegación anterior/siguiente
 document.getElementById('repNav').innerHTML = r.p==='todo'
  ? `<span style="margin:auto">${r.lbl}</span>`
  : `<button onclick="movePeriod(-1)">◀</button><span>${r.lbl}</span><button onclick="movePeriod(1)" ${r.o>=0?'style="opacity:.3"':''}>▶</button>`;

 const{data,error}=await sb.from('sales_history').select('*')
   .gte('closed_at',r.ini.toISOString()).lt('closed_at',r.fin.toISOString())
   .order('closed_at',{ascending:false});
 if(error){console.error(error);document.getElementById('repList').innerHTML='<div class="order-empty">❌ Error al cargar</div>';return}

 const ventas=data||[];
 const total=ventas.reduce((s,v)=>s+parseFloat(v.total),0);
 const cont={};let arts=0;
 ventas.forEach(v=>(v.items||[]).forEach(i=>{
  const k=i.name+(i.mods&&i.mods.length?' ('+i.mods.join(', ')+')':'');
  if(!cont[k])cont[k]={q:0,e:0};
  cont[k].q+=i.quantity;cont[k].e+=i.price*i.quantity;arts+=i.quantity;
 }));
 document.getElementById('repTotal').textContent=total.toFixed(2)+'€';
 document.getElementById('repMesas').textContent=ventas.length;
 document.getElementById('repArts').textContent=arts;
 const rows=Object.entries(cont).sort((a,b)=>b[1].q-a[1].q);
 document.getElementById('repList').innerHTML=rows.length?rows.map(([n,d])=>
  `<div class="rep-row"><span class="rep-name">${n}</span><span class="rep-qty">${d.q}</span><span class="rep-eur">${d.e.toFixed(2)}€</span></div>`
 ).join(''):'<div class="order-empty">Sin ventas en este periodo</div>';
}

    <input class="ed-price" data-id="${p.id}" data-f="p" type="number" step="0.05" inputmode="decimal" value="${p.p.toFixed(2)}">

    <button class="ed-del" onclick="edDel('${p.id}')">✕</button>
   </div>`).join(''):'<div class="order-empty">Sin productos. Pulsa Añadir.</div>';
}
// Vuelca lo escrito en los inputs al borrador
function edSyncInputs(){
 document.querySelectorAll('#edList input').forEach(inp=>{
  const p=STATE.edDraft.find(x=>x.id===inp.dataset.id);
  if(!p)return;
  const f=inp.dataset.f;
  if(f==='n')p.n=inp.value;
  else p[f]=parseFloat(inp.value)||0;
 });
}
function edAdd(){
 edSyncInputs();
 STATE.edDraft.push({id:'x'+Date.now()+Math.floor(Math.random()*999),c:STATE.edCat,n:'Nuevo producto',p:0,cost:0});
 edRender();
 setTimeout(()=>{const i=document.querySelectorAll('#edList .ed-name');if(i.length){i[i.length-1].focus();i[i.length-1].select()}},80);
}
function edDel(id){
 edSyncInputs();
 const p=STATE.edDraft.find(x=>x.id===id);
 if(!p)return;
 if(!confirm('¿Borrar "'+p.n+'"?'))return;
 STATE.edDeleted.push(id);
 STATE.edDraft=STATE.edDraft.filter(x=>x.id!==id);
 edRender();
}
async function edSave(){
 edSyncInputs();
 const bad=STATE.edDraft.find(p=>!p.n||!p.n.trim());
 if(bad){toast('❌ Hay un producto sin nombre','error');return}
 try{
  // Marcar como inactivos los borrados
  for(const id of STATE.edDeleted){await sb.from('products').update({active:false}).eq('id',id)}
  // Guardar/actualizar el resto
  const rows=STATE.edDraft.map((p,i)=>({id:p.id,cat:p.c,name:p.n.trim(),price:p.p,cost:p.cost||0,pos:i,active:true,updated_at:new Date().toISOString()}));
  for(let i=0;i<rows.length;i+=100){
   const{error}=await sb.from('products').upsert(rows.slice(i,i+100));
   if(error)throw error;
  }
  await loadProducts();
  STATE.edDeleted=[];
  toast('✓ Carta guardada');
 }catch(e){console.error(e);toast('❌ Error al guardar','error')}
}

// ===== EXTRAS: añadir opciones a un producto ya puesto en la comanda =====
function openExtras(){
 const c=STATE.table.consumed||[];
 const cand=c.map((it,i)=>({it,i})).filter(x=>!x.it.sent&&!x.it.isNota);
 if(!cand.length){toast('❌ Añade primero un producto','error');return}
 // el último añadido que admita extras
 const last=cand[cand.length-1];
 const prod=PRODS.find(p=>p.id===last.it.product_id);
 if(!prod||!modsFor(prod)){toast('❌ Ese producto no tiene extras','error');return}
 editExtras(last.i);
}
// Abre las opciones de una línea concreta (también al tocarla en la lista)
function editExtras(idx){
 const it=STATE.table.consumed[idx];
 if(!it||it.sent||it.isNota)return;
 const prod=PRODS.find(p=>p.id===it.product_id);
 const mods=prod?modsFor(prod):null;
 if(!mods){toast('❌ Sin extras para este producto','error');return}
 STATE.pendMod={p:prod,mods:mods,sel:(it.mods||[]).slice(),editIdx:idx};
 document.getElementById('modTitle').textContent=prod.n+'  ·  '+prod.p.toFixed(2)+'€';
 renderModGrid();
 document.getElementById('modModal').classList.remove('hidden');
}

// ===== NOTAS =====
function openNota(){
 document.getElementById('notaText').value='';
 document.getElementById('notaModal').classList.remove('hidden');
 setTimeout(()=>document.getElementById('notaText').focus(),100);
}
function closeNota(){document.getElementById('notaModal').classList.add('hidden')}
async function addNota(){
 const txt=document.getElementById('notaText').value.trim();
 if(!txt){toast('❌ Escribe algo','error');return}
 closeNota();
 const c=STATE.table.consumed||[];
 c.push({key:'nota|'+Date.now(),product_id:'nota',name:'📝 '+txt,mods:[],price:0,quantity:1,sent:false,isNota:true});
 STATE.table.consumed=c;
 recalc();renderOrder();await persist();
 toast('✓ Nota añadida');
}

// ===== SONIDO DE AVISO EN COCINA =====
let lastOrderIds=null;
function playBell(){
 try{
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  [880,1320].forEach((f,i)=>{
   const o=ctx.createOscillator(),g=ctx.createGain();
   o.connect(g);g.connect(ctx.destination);
   o.type='sine';o.frequency.value=f;
   const t=ctx.currentTime+i*0.18;
   g.gain.setValueAtTime(0.0001,t);
   g.gain.exponentialRampToValueAtTime(0.5,t+0.02);
   g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
   o.start(t);o.stop(t+0.5);
  });
 }catch(e){console.log('sonido no disponible')}
}
function checkNewOrders(){
 const ids=STATE.orders.filter(o=>o.status==='pendiente').map(o=>o.id);
 if(lastOrderIds!==null && ids.some(id=>!lastOrderIds.includes(id))){
  playBell();
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
 }
 lastOrderIds=ids;
}

// ===== TICKET =====
const BAR={nombre:"ALINA'S BAR",titular:"Alexei Martin Alvarez",dni:"60542811A"};
function buildTicket(mesa,items,total,fecha,num){
 let h=`<html><head><meta charset="utf-8"><style>
 body{font-family:monospace;width:80mm;padding:8px;margin:0;font-size:12px}
 .c{text-align:center}.b{font-weight:bold}
 h1{font-size:16px;margin:0}
 .l{border-top:1px dashed #000;margin:6px 0}
 table{width:100%;font-size:12px;border-collapse:collapse}
 td{padding:2px 0;vertical-align:top}
 .r{text-align:right}
 .tot{font-size:15px;font-weight:bold}
 .sm{font-size:10px}
 </style></head><body>`;
 h+=`<div class="c"><h1>${BAR.nombre}</h1>`;
 h+=`<div class="sm">${BAR.titular}</div>`;
 h+=`<div class="sm">DNI: ${BAR.dni}</div></div>`;
 h+=`<div class="l"></div>`;
 h+=`<table><tr><td>Ticket:</td><td class="r b">${num}</td></tr>`;
 h+=`<tr><td>Mesa:</td><td class="r b">${mesa}</td></tr>`;
 h+=`<tr><td>Fecha:</td><td class="r">${fecha}</td></tr></table>`;
 h+=`<div class="l"></div><table>`;
 items.filter(i=>!i.isNota).forEach(i=>{
  h+=`<tr><td>${i.quantity} x ${i.name}</td><td class="r">${(i.price*i.quantity).toFixed(2)}</td></tr>`;
  if(i.mods&&i.mods.length)h+=`<tr><td colspan="2" class="sm">&nbsp;&nbsp;${i.mods.join(', ')}</td></tr>`;
 });
 h+=`</table><div class="l"></div>`;
 const base=total/1.21,iva=total-base;
 h+=`<table><tr><td>Base imponible</td><td class="r">${base.toFixed(2)}</td></tr>`;
 h+=`<tr><td>IVA 21%</td><td class="r">${iva.toFixed(2)}</td></tr>`;
 h+=`<tr class="tot"><td>TOTAL</td><td class="r">${total.toFixed(2)} EUR</td></tr></table>`;
 h+=`<div class="l"></div><div class="c sm">Gracias por su visita</div></body></html>`;
 return h;
}

function toast(m,t){const d=document.createElement('div');d.className='toast '+(t||'');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
