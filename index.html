<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Alina's Bar - TPV Profesional</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #f0f0f0;
        }

        /* ============================================
           LOGIN
           ============================================ */

        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
        }

        .login-box {
            background: #2a2a2a;
            padding: 2.5rem;
            border-radius: 1rem;
            border: 2px solid #f97316;
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            font-size: 2rem;
            color: #f97316;
            margin-bottom: 0.5rem;
        }

        .login-box p {
            color: #9ca3af;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #444;
            border-radius: 0.5rem;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: #f97316;
            color: #1a1a1a;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .login-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .login-options button {
            padding: 0.75rem;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .demo-info {
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            line-height: 1.5;
        }

        .hidden {
            display: none !important;
        }

        /* ============================================
           PANTALLA: INICIO (MESAS)
           ============================================ */

        .screen-home {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 1rem;
            background: #1a1a1a;
            overflow: hidden;
        }

        .home-header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f97316;
        }

        .home-header h1 {
            font-size: 1.8rem;
            color: #f97316;
        }

        .home-header p {
            color: #9ca3af;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .home-actions {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .home-actions .badge {
            background: #3b82f6;
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .home-actions .logout-btn {
            background: #6b7280;
            color: #fff;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .mesas-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 0.75rem;
            overflow-y: auto;
        }

        .mesa-item {
            aspect-ratio: 1;
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0.5rem;
            text-align: center;
            position: relative;
        }

        .mesa-item:hover {
            border-color: #f97316;
            transform: scale(1.05);
        }

        .mesa-item.ocupada {
            background: #3a2a1a;
            border-color: #f59e0b;
        }

        .mesa-num {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .mesa-total {
            font-size: 0.65rem;
            color: #f97316;
            font-weight: 700;
            margin-top: 0.25rem;
        }

        /* ============================================
           PANTALLA: COMANDA
           ============================================ */

        .screen-comanda {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1a1a1a;
            overflow: hidden;
        }

        .comanda-header {
            background: #0d0d0d;
            padding: 0.75rem;
            border-bottom: 2px solid #f97316;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .comanda-header-left {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .back-btn {
            background: #6b7280;
            color: #fff;
            border: none;
            padding: 0.5rem 0.8rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .header-mesa-info {
            display: flex;
            gap: 1rem;
        }

        .header-item {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .header-label {
            font-size: 0.65rem;
            color: #9ca3af;
            text-transform: uppercase;
        }

        .header-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f97316;
        }

        /* CATEGORÍAS COLAPSABLES */

        .categories-section {
            background: #0d0d0d;
            padding: 0.5rem;
            border-bottom: 1px solid #333;
            max-height: 35%;
            overflow-y: auto;
        }

        .category-item {
            margin-bottom: 0.3rem;
        }

        .category-header {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 0.6rem;
            border-radius: 0.4rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .category-header:hover {
            border-color: #f97316;
        }

        .category-header.active {
            background: #f97316;
            color: #000;
            border-color: #f97316;
        }

        .category-icon {
            font-size: 1.2rem;
            margin-right: 0.5rem;
        }

        .category-arrow {
            font-size: 0.8rem;
            transition: transform 0.2s;
        }

        .category-header.active .category-arrow {
            transform: rotate(180deg);
        }

        .category-products {
            display: none;
            background: #1a1a1a;
            padding: 0.5rem;
            gap: 0.5rem;
            grid-template-columns: repeat(3, 1fr);
            border-bottom: 1px solid #333;
        }

        .category-products.active {
            display: grid;
        }

        .product-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 0.4rem;
            padding: 0.5rem;
            cursor: pointer;
            text-align: center;
            font-size: 0.8rem;
            color: #fff;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .product-btn:hover {
            border-color: #f97316;
        }

        .product-btn-icon {
            font-size: 1.5rem;
        }

        .product-btn-name {
            font-weight: 600;
            line-height: 1.1;
        }

        .product-btn-price {
            color: #f97316;
            font-weight: 700;
            font-size: 0.75rem;
        }

        /* COMANDA Y TOTALES */

        .comanda-bottom {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0d0d0d;
            padding: 0.75rem;
            border-top: 1px solid #333;
        }

        .comanda-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f97316;
            margin-bottom: 0.5rem;
        }

        .comanda-items {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 0.5rem;
        }

        .comanda-item {
            background: #2a2a2a;
            padding: 0.5rem;
            border-radius: 0.3rem;
            border-left: 2px solid #f97316;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            gap: 0.4rem;
        }

        .comanda-item-name {
            flex: 1;
            font-weight: 600;
        }

        .comanda-item-qty {
            background: #444;
            padding: 0.2rem 0.4rem;
            border-radius: 0.2rem;
            font-weight: 600;
            font-size: 0.75rem;
            min-width: 1.5rem;
            text-align: center;
        }

        .comanda-item-price {
            color: #f97316;
            font-weight: 700;
            min-width: 2rem;
            text-align: right;
            font-size: 0.8rem;
        }

        .comanda-item-remove {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 0.2rem 0.4rem;
            border-radius: 0.2rem;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .comanda-totals {
            background: #1a1a1a;
            padding: 0.5rem;
            border-radius: 0.3rem;
            border: 1px solid #f97316;
            margin-bottom: 0.5rem;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .total-row.final {
            border-top: 1px solid #333;
            padding-top: 0.3rem;
            margin-top: 0.3rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: #f97316;
        }

        .comanda-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
        }

        .action-btn {
            padding: 0.5rem;
            border: none;
            border-radius: 0.3rem;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .btn-send {
            background: #10b981;
            color: #fff;
            grid-column: 1 / -1;
        }

        .btn-print {
            background: #3b82f6;
            color: #fff;
        }

        .btn-clear {
            background: #6b7280;
            color: #fff;
        }

        /* ============================================
           PANTALLA: COCINA
           ============================================ */

        .screen-kitchen {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1a1a1a;
            padding: 1rem;
            overflow: hidden;
        }

        .kitchen-header {
            text-align: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #10b981;
        }

        .kitchen-header h1 {
            font-size: 1.8rem;
            color: #10b981;
        }

        .kitchen-orders {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            overflow-y: auto;
        }

        .kitchen-card {
            background: #2a2a2a;
            border: 2px solid #f59e0b;
            border-radius: 0.5rem;
            padding: 1rem;
        }

        .kitchen-card.done {
            border-color: #10b981;
            background: #1a3a2a;
        }

        .kitchen-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #444;
        }

        .kitchen-card-mesa {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f97316;
        }

        .kitchen-card-time {
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .kitchen-card-items {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .kitchen-card-item {
            background: #1a1a1a;
            padding: 0.5rem;
            border-radius: 0.3rem;
            border-left: 3px solid #f97316;
        }

        .kitchen-item-qty {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .kitchen-item-name {
            color: #fff;
            font-size: 0.9rem;
        }

        .kitchen-card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .kitchen-btn {
            padding: 0.6rem;
            border: none;
            border-radius: 0.4rem;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-done {
            background: #10b981;
            color: #fff;
        }

        .btn-cancel {
            background: #6b7280;
            color: #fff;
        }

        /* ============================================
           TOAST
           ============================================ */

        .toast {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            background: #10b981;
            color: #fff;
            padding: 0.75rem 1.2rem;
            border-radius: 0.5rem;
            z-index: 1000;
            animation: slideUp 0.3s ease-out;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .toast.error {
            background: #ef4444;
        }

        @keyframes slideUp {
            from {
                transform: translateY(200px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */

        @media (max-width: 768px) {
            .mesas-grid {
                grid-template-columns: repeat(5, 1fr);
            }

            .comanda-header {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .header-mesa-info {
                gap: 0.5rem;
            }

            .product-btn {
                font-size: 0.7rem;
            }

            .product-btn-icon {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>🍷 Alina's Bar</h1>
            <p>Sistema Profesional de Comandas</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" value="camarero@alinas.bar" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" value="demo123" required>
                </div>

                <button type="submit" class="login-btn">ACCEDER</button>

                <div class="login-options">
                    <button type="button" onclick="quickLogin('camarero@alinas.bar', 'demo123')">📦 Camarero</button>
                    <button type="button" onclick="quickLogin('cocina@alinas.bar', 'demo123')">👨‍🍳 Cocina</button>
                </div>
            </form>

            <div class="demo-info">
                <strong>👤 Usuarios:</strong><br>
                📦 camarero@alinas.bar<br>
                👨‍🍳 cocina@alinas.bar<br>
                Contraseña: demo123
            </div>
        </div>
    </div>

    <!-- PANTALLA: INICIO (MESAS) -->
    <div id="screenHome" class="screen-home hidden">
        <div class="home-actions">
            <span class="badge" id="userBadge">CAMARERO</span>
            <button class="logout-btn" onclick="logout()">SALIR</button>
        </div>

        <div class="home-header">
            <h1>🍷 ALINA'S BAR</h1>
            <p>Selecciona una mesa para comenzar</p>
        </div>

        <div class="mesas-grid" id="mesasGrid"></div>
    </div>

    <!-- PANTALLA: COMANDA -->
    <div id="screenComanda" class="screen-comanda hidden">
        <div class="comanda-header">
            <div class="comanda-header-left">
                <button class="back-btn" onclick="goHome()">← ATRÁS</button>
                <div class="header-mesa-info">
                    <div class="header-item">
                        <span class="header-label">Mesa</span>
                        <span class="header-value" id="headerMesa">-</span>
                    </div>
                    <div class="header-item">
                        <span class="header-label">Total</span>
                        <span class="header-value" id="headerTotal">0,00€</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="categories-section" id="categoriesSection"></div>

        <div class="comanda-bottom">
            <div class="comanda-title">📋 COMANDA</div>
            <div class="comanda-items" id="comandaItems"></div>

            <div class="comanda-totals">
                <div class="total-row">
                    <span>Subtotal</span>
                    <span id="subtotal">0,00€</span>
                </div>
                <div class="total-row">
                    <span>IVA 21%</span>
                    <span id="totalVat">0,00€</span>
                </div>
                <div class="total-row final">
                    <span>TOTAL</span>
                    <span id="totalPrice">0,00€</span>
                </div>
            </div>

            <div class="comanda-actions">
                <button class="action-btn btn-print" onclick="printOrder()">🖨️ IMPRIMIR</button>
                <button class="action-btn btn-clear" onclick="clearOrder()">🗑️ LIMPIAR</button>
                <button class="action-btn btn-send" onclick="sendOrder()">📤 ENVIAR A COCINA</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA: COCINA -->
    <div id="screenKitchen" class="screen-kitchen hidden">
        <div class="kitchen-header">
            <h1>👨‍🍳 COCINA</h1>
            <p id="kitchenTime">Cargando órdenes...</p>
        </div>
        <div class="kitchen-orders" id="kitchenOrders"></div>
    </div>

    <script>
        // ============================================
        // ESTADO GLOBAL
        // ============================================

        const STATE = {
            user: null,
            currentTable: null,
            currentOrder: [],
            currentCategory: null,
            categories: [],
            products: [],
            tables: [],
            orders: [],
        };

        // ============================================
        // BASE DE DATOS LOCAL
        // ============================================

        class DB {
            static init() {
                if (!localStorage.getItem('alinas_v5_init')) {
                    const categories = [
                        { id: '1', name: 'Cervezas', icon: '🍺' },
                        { id: '2', name: 'Bebidas', icon: '🥤' },
                        { id: '3', name: 'Desayunos', icon: '🥐' },
                        { id: '4', name: 'Cafés', icon: '☕' },
                        { id: '5', name: 'Refrescos', icon: '🧃' },
                        { id: '6', name: 'Tapas', icon: '🍤' },
                    ];

                    const products = [
                        { id: '1', name: 'Caña', price: 2.50, category_id: '1', icon: '🍺' },
                        { id: '2', name: 'Botellín', price: 3.00, category_id: '1', icon: '🍾' },
                        { id: '3', name: 'Tercio', price: 4.00, category_id: '1', icon: '🍻' },
                        { id: '4', name: 'Agua', price: 1.50, category_id: '2', icon: '💧' },
                        { id: '5', name: 'Coca', price: 2.00, category_id: '2', icon: '🥤' },
                        { id: '6', name: 'Fanta', price: 2.00, category_id: '2', icon: '🧡' },
                        { id: '7', name: 'Tostada', price: 2.50, category_id: '3', icon: '🍞' },
                        { id: '8', name: 'Croissant', price: 2.00, category_id: '3', icon: '🥐' },
                        { id: '9', name: 'Churro', price: 1.50, category_id: '3', icon: '🍮' },
                        { id: '10', name: 'Café Solo', price: 1.50, category_id: '4', icon: '☕' },
                        { id: '11', name: 'Café Leche', price: 2.00, category_id: '4', icon: '🥛' },
                        { id: '12', name: 'Cortado', price: 1.75, category_id: '4', icon: '☕' },
                        { id: '13', name: 'Zumo', price: 2.50, category_id: '5', icon: '🍊' },
                        { id: '14', name: 'Refresco', price: 1.50, category_id: '5', icon: '🧃' },
                        { id: '15', name: 'Aceitunas', price: 1.50, category_id: '6', icon: '🫒' },
                        { id: '16', name: 'Jamón', price: 3.50, category_id: '6', icon: '🍖' },
                    ];

                    const tables = [];
                    for (let i = 1; i <= 13; i++) tables.push({ id: 't' + i, name: 'T' + i, total: 0, consumed: [] });
                    for (let i = 1; i <= 6; i++) tables.push({ id: 'b' + i, name: 'B' + i, total: 0, consumed: [] });
                    for (let i = 1; i <= 4; i++) tables.push({ id: 's' + i, name: 'S' + i, total: 0, consumed: [] });

                    localStorage.setItem('alinas_v5_categories', JSON.stringify(categories));
                    localStorage.setItem('alinas_v5_products', JSON.stringify(products));
                    localStorage.setItem('alinas_v5_tables', JSON.stringify(tables));
                    localStorage.setItem('alinas_v5_orders', JSON.stringify([]));
                    localStorage.setItem('alinas_v5_users', JSON.stringify([
                        { id: '1', email: 'camarero@alinas.bar', password: 'demo123', name: 'Camarero', role: 'camarero' },
                        { id: '2', email: 'cocina@alinas.bar', password: 'demo123', name: 'Cocina', role: 'cocina' },
                    ]));
                    localStorage.setItem('alinas_v5_init', 'true');
                }
            }

            static get(key) {
                return JSON.parse(localStorage.getItem(key) || '[]');
            }

            static set(key, value) {
                localStorage.setItem(key, JSON.stringify(value));
            }
        }

        // ============================================
        // LOGIN
        // ============================================

        function login(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const users = DB.get('alinas_v5_users');
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                STATE.user = user;
                if (user.role === 'cocina') {
                    showKitchenScreen();
                } else {
                    showHomeScreen();
                }
            } else {
                showToast('❌ Credenciales incorrectas', 'error');
            }
        }

        function quickLogin(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }

        function logout() {
            STATE.user = null;
            STATE.currentTable = null;
            STATE.currentOrder = [];
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('screenHome').classList.add('hidden');
            document.getElementById('screenComanda').classList.add('hidden');
            document.getElementById('screenKitchen').classList.add('hidden');
        }

        // ============================================
        // PANTALLA: INICIO
        // ============================================

        function showHomeScreen() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('screenHome').classList.remove('hidden');
            document.getElementById('screenComanda').classList.add('hidden');
            document.getElementById('screenKitchen').classList.add('hidden');

            STATE.categories = DB.get('alinas_v5_categories');
            STATE.products = DB.get('alinas_v5_products');
            STATE.tables = DB.get('alinas_v5_tables');
            STATE.orders = DB.get('alinas_v5_orders');

            document.getElementById('userBadge').textContent = STATE.user.role.toUpperCase();

            renderMesas();
        }

        function renderMesas() {
            const html = STATE.tables.map((table, idx) => `
                <div class="mesa-item ${table.total > 0 ? 'ocupada' : ''}" onclick="selectMesa('${table.id}')">
                    <div class="mesa-num">${idx + 1}</div>
                    ${table.total > 0 ? `<div class="mesa-total">${table.total.toFixed(2)}€</div>` : ''}
                </div>
            `).join('');
            document.getElementById('mesasGrid').innerHTML = html;
        }

        function selectMesa(tableId) {
            const table = STATE.tables.find(t => t.id === tableId);
            if (table) {
                STATE.currentTable = table;
                STATE.currentOrder = [];
                showComandaScreen();
            }
        }

        // ============================================
        // PANTALLA: COMANDA
        // ============================================

        function showComandaScreen() {
            document.getElementById('screenHome').classList.add('hidden');
            document.getElementById('screenComanda').classList.remove('hidden');

            document.getElementById('headerMesa').textContent = STATE.currentTable.name;

            renderCategories();
            updateComandaDisplay();
        }

        function renderCategories() {
            let html = '';
            STATE.categories.forEach(cat => {
                const products = STATE.products.filter(p => p.category_id === cat.id);
                html += `
                    <div class="category-item">
                        <div class="category-header" onclick="toggleCategory('${cat.id}')">
                            <div>
                                <span class="category-icon">${cat.icon}</span>
                                ${cat.name}
                            </div>
                            <span class="category-arrow">▼</span>
                        </div>
                        <div class="category-products" id="cat-${cat.id}">
                            ${products.map(p => `
                                <button class="product-btn" onclick="addProduct('${p.id}')">
                                    <div class="product-btn-icon">${p.icon}</div>
                                    <div class="product-btn-name">${p.name}</div>
                                    <div class="product-btn-price">${p.price.toFixed(2)}€</div>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            document.getElementById('categoriesSection').innerHTML = html;
        }

        function toggleCategory(catId) {
            const element = document.getElementById('cat-' + catId);
            const header = element.previousElementSibling;

            // Cerrar todas las demás
            document.querySelectorAll('.category-products').forEach(el => {
                if (el !== element) el.classList.remove('active');
            });
            document.querySelectorAll('.category-header').forEach(h => {
                if (h !== header) h.classList.remove('active');
            });

            // Toggle la actual
            element.classList.toggle('active');
            header.classList.toggle('active');
        }

        function addProduct(productId) {
            const product = STATE.products.find(p => p.id === productId);
            const existing = STATE.currentOrder.find(item => item.product_id === productId);

            if (existing) {
                existing.quantity += 1;
            } else {
                STATE.currentOrder.push({
                    product_id: productId,
                    name: product.name,
                    price: product.price,
                    quantity: 1,
                    icon: product.icon,
                });
            }

            updateComandaDisplay();
            showToast(`✓ ${product.name}`);
        }

        function updateComandaDisplay() {
            const itemsHtml = STATE.currentOrder.map((item, idx) => `
                <div class="comanda-item">
                    <span class="comanda-item-name">${item.icon} ${item.name}</span>
                    <span class="comanda-item-qty">${item.quantity}</span>
                    <span class="comanda-item-price">${(item.price * item.quantity).toFixed(2)}€</span>
                    <button class="comanda-item-remove" onclick="removeItem(${idx})">✕</button>
                </div>
            `).join('');

            document.getElementById('comandaItems').innerHTML = itemsHtml || '<div style="text-align: center; color: #9ca3af; font-size: 0.8rem; padding: 1rem;">Sin productos</div>';

            const subtotal = STATE.currentOrder.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const vat = subtotal * 0.21;
            const total = subtotal + vat;

            document.getElementById('subtotal').textContent = subtotal.toFixed(2) + '€';
            document.getElementById('totalVat').textContent = vat.toFixed(2) + '€';
            document.getElementById('totalPrice').textContent = total.toFixed(2) + '€';
            document.getElementById('headerTotal').textContent = total.toFixed(2) + '€';
        }

        function removeItem(idx) {
            STATE.currentOrder.splice(idx, 1);
            updateComandaDisplay();
        }

        function clearOrder() {
            if (confirm('¿Vaciar comanda?')) {
                STATE.currentOrder = [];
                updateComandaDisplay();
            }
        }

        function sendOrder() {
            if (STATE.currentOrder.length === 0) {
                showToast('❌ Añade productos', 'error');
                return;
            }

            const subtotal = STATE.currentOrder.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const vat = subtotal * 0.21;
            const total = subtotal + vat;

            const order = {
                id: Date.now(),
                tableId: STATE.currentTable.id,
                tableName: STATE.currentTable.name,
                items: STATE.currentOrder,
                total: total,
                subtotal: subtotal,
                vat: vat,
                timestamp: new Date().toLocaleTimeString('es-ES'),
                status: 'pendiente',
            };

            STATE.orders.push(order);
            DB.set('alinas_v5_orders', STATE.orders);

            // Actualizar mesa
            STATE.currentTable.total += total;
            STATE.currentTable.consumed.push(...STATE.currentOrder);
            DB.set('alinas_v5_tables', STATE.tables);

            showToast('✓ Comanda enviada a cocina');
            STATE.currentOrder = [];
            updateComandaDisplay();

            setTimeout(() => goHome(), 1500);
        }

        function printOrder() {
            if (STATE.currentOrder.length === 0) {
                showToast('❌ Sin productos', 'error');
                return;
            }

            const subtotal = STATE.currentOrder.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const vat = subtotal * 0.21;
            const total = subtotal + vat;

            let html = `<html><head><style>body{font-family:monospace;width:80mm;padding:1rem;margin:0}h1{text-align:center;font-size:1rem}table{width:100%;font-size:0.8rem}td{padding:0.25rem}tr.total td{font-weight:bold}.line{border-top:1px dashed #000;margin:0.5rem 0}</style></head><body>`;
            html += `<h1>ALINA'S BAR</h1>`;
            html += `<p style="text-align:center;font-size:0.8rem">Mesa: ${STATE.currentTable.name}</p>`;
            html += `<p style="text-align:center;font-size:0.7rem">${new Date().toLocaleString('es-ES')}</p>`;
            html += `<div class="line"></div><table>`;

            STATE.currentOrder.forEach(item => {
                html += `<tr><td>${item.quantity}x ${item.name}</td><td style="text-align:right">${(item.price * item.quantity).toFixed(2)}€</td></tr>`;
            });

            html += `</table><div class="line"></div><table style="margin-top:0.5rem"><tr><td>Subtotal:</td><td style="text-align:right">${subtotal.toFixed(2)}€</td></tr><tr><td>IVA:</td><td style="text-align:right">${vat.toFixed(2)}€</td></tr><tr class="total"><td>TOTAL:</td><td style="text-align:right">${total.toFixed(2)}€</td></tr></table><p style="text-align:center;margin-top:1rem;font-size:0.8rem">¡Gracias!</p></body></html>`;

            const win = window.open();
            win.document.write(html);
            win.print();
        }

        function goHome() {
            showHomeScreen();
        }

        // ============================================
        // PANTALLA: COCINA
        // ============================================

        function showKitchenScreen() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('screenHome').classList.add('hidden');
            document.getElementById('screenComanda').classList.add('hidden');
            document.getElementById('screenKitchen').classList.remove('hidden');

            STATE.orders = DB.get('alinas_v5_orders');

            setInterval(() => {
                STATE.orders = DB.get('alinas_v5_orders');
                renderKitchenOrders();
            }, 1000);

            renderKitchenOrders();
        }

        function renderKitchenOrders() {
            const pendingOrders = STATE.orders.filter(o => o.status === 'pendiente');

            if (pendingOrders.length === 0) {
                document.getElementById('kitchenOrders').innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: #9ca3af;">✓ Todas las órdenes completadas</div>';
                return;
            }

            const html = pendingOrders.map(order => `
                <div class="kitchen-card">
                    <div class="kitchen-card-header">
                        <div class="kitchen-card-mesa">🏠 ${order.tableName}</div>
                        <div class="kitchen-card-time">${order.timestamp}</div>
                    </div>
                    <div class="kitchen-card-items">
                        ${order.items.map(item => `
                            <div class="kitchen-card-item">
                                <div class="kitchen-item-qty">${item.quantity}x ${item.icon}</div>
                                <div class="kitchen-item-name">${item.name}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="kitchen-card-actions">
                        <button class="kitchen-btn btn-done" onclick="completeOrder(${order.id})">✓ LISTO</button>
                        <button class="kitchen-btn btn-cancel" onclick="cancelOrder(${order.id})">✕ CANCEL</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('kitchenOrders').innerHTML = html;
        }

        function completeOrder(orderId) {
            const order = STATE.orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'completada';
                DB.set('alinas_v5_orders', STATE.orders);
                renderKitchenOrders();
                showToast('✓ Orden completada');
            }
        }

        function cancelOrder(orderId) {
            if (confirm('¿Cancelar orden?')) {
                STATE.orders = STATE.orders.filter(o => o.id !== orderId);
                DB.set('alinas_v5_orders', STATE.orders);
                renderKitchenOrders();
                showToast('✓ Orden cancelada');
            }
        }

        // ============================================
        // UTILIDADES
        // ============================================

        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // ============================================
        // INICIO
        // ============================================

        document.addEventListener('DOMContentLoaded', () => {
            DB.init();
            document.getElementById('loginForm').addEventListener('submit', login);

            // Si es cocina, mostrar pantalla de cocina
            const url = new URLSearchParams(window.location.search);
            if (url.get('kitchen') === 'true') {
                STATE.user = { role: 'cocina' };
                showKitchenScreen();
            }
        });
    </script>
</body>
</html>
